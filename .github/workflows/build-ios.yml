name: Compilar iPhone

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Compilar (simulador, sin firma)
        run: |
          cd ios
          xcodebuild -project GeoPlano.xcodeproj -scheme GeoPlano \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}

  testflight:
    # Se activa cuando existan los secretos de Apple (ver ios/README-iPhone.md)
    needs: build
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CARPLAY_APROBADO: ${{ secrets.CARPLAY_APROBADO }}
    steps:
      - uses: actions/checkout@v4
        if: env.ASC_KEY_ID != ''
      - name: Subir a TestFlight
        if: env.ASC_KEY_ID != ''
        run: |
          set -eo pipefail
          brew install xcodegen
          cd ios && xcodegen generate
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_P8" > "$KEY"
          BUILD=$(( ${{ github.run_number }} + 1 ))
          # Sin el permiso CarPlay aprobado por Apple, se firma sin él (la app funciona igual en el iPhone)
          ENT=""
          if [ "$CARPLAY_APROBADO" != "si" ]; then ENT="CODE_SIGN_ENTITLEMENTS="; fi
          xcodebuild -project GeoPlano.xcodeproj -scheme GeoPlano -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/GeoPlano.xcarchive \
            GEOPLANO_TEAM_ID="$TEAM_ID" CURRENT_PROJECT_VERSION=$BUILD $ENT \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 60
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/GeoPlano.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Sin cuenta de Apple todavía
        if: env.ASC_KEY_ID == ''
        run: echo "Faltan los secretos de Apple; se omite la subida a TestFlight."
