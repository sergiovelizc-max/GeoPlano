name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compilar
        run: gradle assembleDebug --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeoPlano.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeoPlano-apk
          path: GeoPlano.apk
      - name: Publicar en "Releases" (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: GeoPlano – última versión
          body: Descarga GeoPlano.apk desde el celular e instálalo.
          files: GeoPlano.apk
          make_latest: true
